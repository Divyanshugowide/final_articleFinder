version: '3.8'

services:
  app:
    build: .
    ports:
      - "80:80"
      - "8000:8000"
    volumes:
      - app_data:/app/data
      - ./backend:/app/backend  # For development: live code updates
    environment:
      - PYTHONIOENCODING=utf-8
      - TRANSFORMERS_CACHE=/app/.cache/transformers
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app_data:  # Named volume for persistent data